[project]
name = "kachel-scheduler"
version = "0.1.0"
description = "Hourly heat-led scheduling, the yearly balance and the live demo."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.3", "pandas>=2.3", "matplotlib>=3.10"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
# The package is imported as written (#16); only the tests follow the repo's lint rules.
include = ["tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
