[project]
name = "kachel-agent"
version = "0.1.0"
description = "Runs on the server box: pauses and resumes the real job on the heat signal."
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kachel_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
