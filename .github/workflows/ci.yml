name: CI

# During the hack main takes direct pushes and nothing here blocks a merge.
# Every check still runs on every push and pull request, so red is visible at once.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build

  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: make check-py

  readme:
    name: README
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/*.test.mjs
      - run: node scripts/readme-check.mjs
      - run: node scripts/readme-figures.mjs --check
      - run: python3 scripts/pitch/voiceover.py --check
      # docs/assumptions.md must match services/scheduler/config.json (pnpm assumptions).
      - run: node scripts/assumptions.mjs --check

  # The local Supabase stack in Docker: migrations and seed apply cleanly, and the schema lints.
  database:
    name: Database
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,storage-api
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase db lint --fail-on warning
      # Row level security (#3, #7): each policy's allow and deny, in supabase/tests.
      - run: pnpm exec supabase test db
      # packages/db/src/database.types.ts must match the schema. If it does not, download the
      # database-types artifact from this run, or run `pnpm db:types` against a local stack.
      - run: pnpm db:types
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-types
          path: packages/db/src/database.types.ts
      - run: git diff --exit-code -- packages/db/src/database.types.ts
      # Realtime (#6): a change written with the agent's key reaches an app subscribed with the
      # anon key within two seconds.
      - name: Realtime reaches a subscribed client
        run: |
          eval "$(pnpm exec supabase status -o env)"
          : "${API_URL:?}" "${ANON_KEY:?}" "${SERVICE_ROLE_KEY:?}"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm --filter @kachel/db test:realtime
      # The fleet writer (#81): one hour of `make fleet` fits the schema and its constraints.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Fleet writer puts one hour into the database
        run: |
          eval "$(pnpm exec supabase status -o env)"
          : "${API_URL:?}" "${SERVICE_ROLE_KEY:?}"
          cd services/scheduler
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            uv run python fleet_write.py --day july --hour 20
      - if: always()
        run: pnpm exec supabase stop --no-backup

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
