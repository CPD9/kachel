name: Wiki

# Copies docs/wiki/*.md to the project wiki (page name = file name) on every push to main that
# changes them. GitHub only creates the wiki's git repository once the first page is saved on
# github.com (Wiki tab, "Create the first page"). Until then this job finds no wiki, says so and
# stops without failing; run it again from the Actions tab after that first page exists.
# The copy only adds and updates pages: a file deleted from docs/wiki stays on the wiki until it
# is deleted there too, and an edit made on github.com is overwritten when its file next changes.
# Edit the pages in docs/wiki, by pull request.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Wiki
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the wiki, if it exists
        id: wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if git ls-remote "$url" >/dev/null 2>&1; then
            git clone --depth 1 "$url" wiki
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No wiki repository yet. Save the first page on github.com, then run this workflow again."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy the pages and push
        if: steps.wiki.outputs.exists == 'true'
        run: |
          cp docs/wiki/*.md wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/wiki."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync the wiki from docs/wiki"
          git push
