<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="t">
  <title id="t">A basement server runs a job, its heat fills the hot-water tank and warms the house</title>
  <style>
    .wall { fill: #fbf8f3; stroke: #2c3340; stroke-width: 2.5; stroke-linejoin: round; }
    .line { fill: none; stroke: #2c3340; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pipe { fill: none; stroke: #e8dccb; stroke-width: 6; stroke-linecap: round; }
    .flow { fill: none; stroke: #e0702a; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 10 14; animation: flow 1.4s linear infinite; }
    .led { fill: #e0702a; animation: blink 1.1s steps(2, jump-none) infinite; }
    .led:nth-of-type(2) { animation-delay: .25s; } .led:nth-of-type(3) { animation-delay: .5s; }
    .led:nth-of-type(4) { animation-delay: .75s; }
    .water { fill: #e0702a; opacity: .85; transform-box: fill-box; transform-origin: bottom; animation: fill 5.6s ease-in-out infinite; }
    .rad { fill: #e8dccb; stroke: #2c3340; stroke-width: 2; animation: warm 5.6s ease-in-out infinite; }
    .wave { fill: none; stroke: #e0702a; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: rise 2.8s ease-out infinite; }
    .wave.b { animation-delay: .9s; } .wave.c { animation-delay: 1.8s; }
    .drop { fill: #7aa7d8; opacity: 0; animation: drip 1.4s ease-in infinite; }
    .drop.b { animation-delay: .45s; } .drop.c { animation-delay: .9s; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }
    @keyframes fill { 0%, 100% { transform: scaleY(.25); } 55%, 80% { transform: scaleY(.95); } }
    @keyframes warm { 0%, 20% { fill: #e8dccb; } 60%, 90% { fill: #f2a36b; } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-16px); } }
    @keyframes drip { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(26px); } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .led, .water, .rad, .wave, .drop { animation: none; }
      .water { transform: scaleY(.8); } .rad { fill: #f2a36b; } .wave { opacity: .7; } .drop { opacity: 1; }
    }
  </style>
  <!-- house -->
  <path class="wall" d="M40 96 L180 22 L320 96 L320 206 L40 206 Z"/>
  <path class="line" d="M40 150 L320 150"/>
  <!-- server in the basement -->
  <rect class="wall" x="66" y="162" width="70" height="34" rx="4"/>
  <circle class="led" cx="80" cy="179" r="3.2"/><circle class="led" cx="92" cy="179" r="3.2"/>
  <circle class="led" cx="104" cy="179" r="3.2"/><circle class="led" cx="116" cy="179" r="3.2"/>
  <!-- tank in the basement -->
  <rect class="wall" x="218" y="158" width="44" height="40" rx="8"/>
  <clipPath id="tank"><rect x="220" y="160" width="40" height="36" rx="7"/></clipPath>
  <rect class="water" clip-path="url(#tank)" x="220" y="160" width="40" height="36"/>
  <!-- pipe: server to tank, tank up to radiator and shower -->
  <path class="pipe" d="M136 180 H218"/><path class="flow" d="M136 180 H218"/>
  <path class="pipe" d="M240 158 V120 H120 V132"/><path class="flow" d="M240 158 V120 H120 V132"/>
  <path class="pipe" d="M262 170 H290 V70"/><path class="flow" d="M262 170 H290 V70"/>
  <!-- radiator upstairs -->
  <rect class="rad" x="96" y="126" width="48" height="18" rx="3"/>
  <path class="line" d="M108 128 V142 M120 128 V142 M132 128 V142"/>
  <path class="wave" d="M104 118 q4 -5 0 -10 q-4 -5 0 -10"/>
  <path class="wave b" d="M120 118 q4 -5 0 -10 q-4 -5 0 -10"/>
  <path class="wave c" d="M136 118 q4 -5 0 -10 q-4 -5 0 -10"/>
  <!-- shower upstairs -->
  <path class="line" d="M290 70 H272 M262 66 H282 L278 74 H266 Z"/>
  <circle class="drop" cx="268" cy="82" r="2.2"/><circle class="drop b" cx="274" cy="82" r="2.2"/>
  <circle class="drop c" cx="280" cy="82" r="2.2"/>
</svg>
